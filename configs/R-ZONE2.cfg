!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname R-ZONE2
!
!
!
!
!
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO2911/K9 sn FTX1524YSJG-
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 192.168.3.1 255.255.255.0
 ip access-group MARKETING-IN in
!
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 192.168.6.1 255.255.255.0
 ip access-group FINANCE-IN in
!
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 192.168.7.1 255.255.255.0
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Serial0/0/0
 ip address 192.168.5.2 255.255.255.252
!
interface Serial0/0/1
 no ip address
 clock rate 2000000
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 4.4.4.4
 log-adjacency-changes
 passive-interface GigabitEthernet0/0.10
 passive-interface GigabitEthernet0/0.20
 passive-interface GigabitEthernet0/0.30
 network 192.168.5.0 0.0.0.3 area 0
 network 192.168.3.0 0.0.0.255 area 2
 network 192.168.6.0 0.0.0.255 area 2
 network 192.168.7.0 0.0.0.255 area 2
!
ip classless
!
ip flow-export version 9
!
!
ip access-list extended MARKETING-IN
 deny ip 192.168.3.0 0.0.0.255 192.168.6.0 0.0.0.255
 permit ip any any
ip access-list extended FINANCE-IN
 deny ip 192.168.6.0 0.0.0.255 192.168.3.0 0.0.0.255
 permit ip any any
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
